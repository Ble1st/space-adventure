name: Android Debug APK

on:
  push:
    branches:
      - "vibe/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot 4.7.2 Mono
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" || \
            python3 -c "import urllib.request;urllib.request.urlretrieve('https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip','godot.zip')"
          mkdir -p "$HOME/.local/opt/godot-mono" "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/opt/godot-mono"
          ln -sf "$HOME/.local/opt/godot-mono/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" "$HOME/.local/bin/godot-mono"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install export templates
        run: |
          python3 -c "import urllib.request;urllib.request.urlretrieve('https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz','templates.tpz')"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/tmp"
          mv "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/tmp/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/"
          rm -rf "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/tmp"

      - name: Configure editor settings and keystore
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          {
            echo '[application]'
            echo 'config/features=PackedStringArray("4.7")'
            echo '[export]'
            echo "android/debug_keystore = \"$HOME/.local/share/godot/keystores/debug.keystore\""
            echo 'android/debug_keystore_pass = "android"'
            echo "android/java_sdk_path = \"$JAVA_HOME\""
            echo "android/android_sdk_path = \"$ANDROID_HOME\""
          } > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Build debug APK
        run: |
          mkdir -p build
          godot-mono --headless --path godot --import || true
          godot-mono --headless --path godot --export-debug "Android" ../build/space-adventure.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/space-adventure.apk | head -2
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 build/space-adventure.apk

      # archive: false lädt die APK unverändert hoch (kein ZIP-Wrapper); der Artefaktname ist dann der Dateiname
      - uses: actions/upload-artifact@v7
        with:
          path: build/space-adventure.apk
          archive: false
          retention-days: 14
